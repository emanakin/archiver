# Private local S3 endpoint. Generate its credentials before starting it.
services:
  content-bucket:
    image: chrislusf/seaweedfs:4.13@sha256:803e0f9f4a190319e39c2b226e15e75bf0ff78d00fe3e2806c38850ca81eb8a7
    command: ["mini", "-dir=/data", "-ip=content-bucket", "-ip.bind=0.0.0.0", "-admin.ui=false", "-s3.config=/run/secrets/content_bucket_identities", "-s3.allowDeleteBucketNotEmpty=false", "-master.telemetry=false", "-s3.port.iceberg=0"]
    networks: [content-bucket]
    volumes:
      - content-bucket-data:/data
      - ./secrets/content_bucket_identities.json:/run/secrets/content_bucket_identities:ro
    restart: unless-stopped
  api:
    environment: &content-bucket-env
      CONTENT_STORAGE_BACKEND: "${CONTENT_STORAGE_BACKEND:-s3}"
      CONTENT_BUCKET: archive-content
      CONTENT_S3_ENDPOINT: http://content-bucket:8333
      CONTENT_S3_CREDENTIALS_FILE: /run/secrets/content_bucket_app
    networks: [default, content-bucket]
    volumes:
      - ./secrets/content_bucket_app.json:/run/secrets/content_bucket_app:ro
  worker:
    environment: *content-bucket-env
    networks: [default, content-bucket]
    volumes:
      - ./secrets/content_bucket_app.json:/run/secrets/content_bucket_app:ro

networks:
  content-bucket:
    internal: true
volumes:
  content-bucket-data:
