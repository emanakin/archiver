services:
  ollama:
    image: ollama/ollama@sha256:5e5802d3c018ecdee7c7dff32a7e3b10ca9a2c4b3a461392cff97c313c2af0fc
    environment:
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "2"
    volumes: [caption-models:/root/.ollama]
    restart: unless-stopped
    mem_limit: 5g
    logging:
      driver: json-file
      options: {max-size: '10m', max-file: '2'}
volumes:
  caption-models:
